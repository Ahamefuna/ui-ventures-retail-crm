services:
  - type: web
    name: ui-ventures-retail-crm
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate --no-input && python manage.py seed_uiventures && gunicorn uiventures_crm.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: USE_MYSQL
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
